name: Build

on:
  push:
    branches: [main, master, feature/*]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      fail-fast: false  # Continue other builds if one fails
      matrix:
        platform: [x86, x64]
        configuration: [Release]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      
      - name: Restore NuGet packages
        run: nuget restore MarkdownViewerPlusPlus.sln
      
      - name: Build
        run: msbuild MarkdownViewerPlusPlus.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /v:normal
      
      - name: Verify DLL exists and show info
        shell: pwsh
        run: |
          $dllPath = "MarkdownViewerPlusPlus\bin\${{ matrix.platform }}\${{ matrix.configuration }}\MarkdownViewerPlusPlus.dll"
          if (Test-Path $dllPath) {
            Write-Host "DLL found at: $dllPath"
            Write-Host "Size: $((Get-Item $dllPath).Length) bytes"
            # Find dumpbin.exe dynamically
            $dumpbin = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC" -Recurse -Filter "dumpbin.exe" | Select-Object -First 1
            if ($dumpbin) {
              Write-Host "Using dumpbin: $($dumpbin.FullName)"
              & $dumpbin.FullName /exports $dllPath
            } else {
              Write-Host "dumpbin not found, skipping export verification"
            }
          } else {
            Write-Error "DLL not found at expected path!"
            Get-ChildItem -Recurse -Filter "*.dll" | Select-Object FullName
            exit 1
          }
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkdownViewerPlusPlus-${{ matrix.platform }}
          path: |
            MarkdownViewerPlusPlus/bin/${{ matrix.platform }}/${{ matrix.configuration }}/MarkdownViewerPlusPlus.dll
            LICENSE.md
            README.md
            license/**
          if-no-files-found: error

  # Create a release when a tag is pushed
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download x86 artifact
        uses: actions/download-artifact@v4
        with:
          name: MarkdownViewerPlusPlus-x86
          path: artifacts/x86
      
      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: MarkdownViewerPlusPlus-x64
          path: artifacts/x64
      
      - name: Create release zips
        run: |
          cd artifacts/x86 && zip -r ../../MarkdownViewerPlusPlus-${{ github.ref_name }}-x86.zip .
          cd ../x64 && zip -r ../../MarkdownViewerPlusPlus-${{ github.ref_name }}-x64.zip .
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            MarkdownViewerPlusPlus-${{ github.ref_name }}-x86.zip
            MarkdownViewerPlusPlus-${{ github.ref_name }}-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
